<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyquist-Shannon Sampling Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .controls {
            margin-bottom: 20px;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        canvas {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            width: 100%;
            height: 400px;
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; }
        .line { height: 3px; width: 20px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sampling & Aliasing Simulator</h2>
    
    <div class="controls">
        <div class="slider-group">
            <label>
                <span>Signal Frequency ($f_{max}$)</span>
                <span id="f_val">3 Hz</span>
            </label>
            <input type="range" id="f_slider" min="1" max="15" value="3" step="1">
        </div>

        <div class="slider-group">
            <label>
                <span>Sampling Rate ($f_s$)</span>
                <span id="fs_val">10 Hz</span>
            </label>
            <input type="range" id="fs_slider" min="2" max="40" value="10" step="1">
        </div>
    </div>

    <div class="status-box" id="status_box"></div>

    <canvas id="waveCanvas" width="850" height="400"></canvas>

    <div class="legend">
        <span><div class="line" style="background: #e0e0e0;"></div> Original Continuous Signal</span>
        <span><div class="dot" style="background: #e53935;"></div> Discrete Samples ($x[n]$)</span>
        <span><div class="line" style="background: #1e88e5;"></div> Reconstructed Signal</span>
    </div>
</div>

<script>
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    const f_slider = document.getElementById('f_slider');
    const fs_slider = document.getElementById('fs_slider');
    const f_val = document.getElementById('f_val');
    const fs_val = document.getElementById('fs_val');
    const status_box = document.getElementById('status_box');

    const width = canvas.width;
    const height = canvas.height;
    const centerY = height / 2;
    const amplitude = height * 0.4;

    function draw() {
        ctx.clearRect(0, 0, width, height);
        
        let f = parseFloat(f_slider.value);
        let fs = parseFloat(fs_slider.value);

        f_val.innerText = f + ' Hz';
        fs_val.innerText = fs + ' Hz';

        // Evaluate Nyquist Condition
        if (fs > 2 * f) {
            status_box.innerHTML = "✅ Perfect Recovery (fs > 2f_max): The sampling rate is high enough to capture the true frequency.";
            status_box.style.backgroundColor = "#e8f5e9";
            status_box.style.color = "#2e7d32";
            status_box.style.borderLeft = "5px solid #4caf50";
        } else if (fs === 2 * f) {
            status_box.innerHTML = "⚠️ Nyquist Limit (fs = 2f_max): Critical boundary. Recovery fails due to phase alignment (samples might only hit zero-crossings).";
            status_box.style.backgroundColor = "#fff3e0";
            status_box.style.color = "#ef6c00";
            status_box.style.borderLeft = "5px solid #ff9800";
        } else {
            status_box.innerHTML = "❌ ALIASING DETECTED (fs < 2f_max): The blue reconstructed wave is a false, lower frequency phantom signal.";
            status_box.style.backgroundColor = "#ffebee";
            status_box.style.color = "#c62828";
            status_box.style.borderLeft = "5px solid #f44336";
        }

        // 1. Draw Original Continuous Wave (Grey)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(150, 150, 150, 0.4)';
        ctx.lineWidth = 4;
        for (let x = 0; x <= width; x++) {
            let t = x / width; // 1 second total duration across canvas
            let y = centerY - amplitude * Math.sin(2 * Math.PI * f * t);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 2. Calculate Samples
        let samplePoints = [];
        let numSamples = Math.floor(fs);
        for(let n = 0; n <= numSamples; n++) {
            let t = n / fs;
            let x = t * width;
            let y = centerY - amplitude * Math.sin(2 * Math.PI * f * t);
            if (x <= width) {
                samplePoints.push({x, y});
            }
        }

        // 3. Draw Reconstructed Wave connecting the samples (Blue)
        ctx.beginPath();
        ctx.strokeStyle = '#1e88e5';
        ctx.lineWidth = 2;
        if (samplePoints.length > 0) {
            ctx.moveTo(samplePoints[0].x, samplePoints[0].y);
            for(let i = 1; i < samplePoints.length; i++) {
                ctx.lineTo(samplePoints[i].x, samplePoints[i].y);
            }
        }
        ctx.stroke();

        // 4. Draw Discrete Sample Points (Red Dots)
        ctx.fillStyle = '#e53935';
        samplePoints.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
            ctx.fill();
            // Optional outline for dots
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        });
    }

    // Event Listeners for Sliders
    f_slider.addEventListener('input', draw);
    fs_slider.addEventListener('input', draw);

    // Initial Draw
    draw();
</script>
</body>
</html>
